name: semaphore_client
description: "Semaphore Client"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

workspace:
  - app_lib/database
  - app_lib/theme
  - app_lib/locale
  - app_lib/provider
  - app_lib/logging
  - app_lib/utils
  - app_lib/api
  - app_bloc/theme
  - app_bloc/error_handler
  - app_bloc/activity
  - app_bloc/history
  - app_bloc/integration
  - app_bloc/inventory
  - app_bloc/inventory_form
  - app_bloc/key_store
  - app_bloc/project
  - app_bloc/project_form
  - app_bloc/repository
  - app_bloc/run_task
  - app_bloc/schedule
  - app_bloc/server
  - app_bloc/server_form
  - app_bloc/task
  - app_bloc/task_output
  - app_bloc/team
  - app_bloc/template
  - app_bloc/variable
  - app_widget/adaptive
  - app_widget/artwork
  - app_widget/feedback
  - app_widget/server
  - app_widget/web_view
  - app_plugins/desktop_tray
  - third_party/form_bloc
  - third_party/flutter_form_bloc
  - third_party/flutter_adaptive_scaffold
  - third_party/settings_ui

dependencies:
  flutter:
    sdk: flutter

  logging: ^1.3.0

  go_router: ^16.0.0

  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  path: any

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  window_manager: ^0.5.1

  # workspace packages
  app_database: any
  app_theme: any
  app_locale: any
  app_provider: any
  app_logging: any
  app_utils: any
  app_api: any
  theme_bloc: any
  error_handler_bloc: any
  activity_bloc: any
  history_bloc: any
  integration_bloc: any
  inventory_bloc: any
  inventory_form_bloc: any
  key_store_bloc: any
  project_bloc: any
  project_form_bloc: any
  repository_bloc: any
  run_task_bloc: any
  schedule_bloc: any
  server_bloc: any
  server_form_bloc: any
  task_bloc: any
  task_output_bloc: any
  team_bloc: any
  template_bloc: any
  variable_bloc: any
  app_artwork: any
  app_feedback: any
  app_adaptive_widgets: any
  app_server: any
  settings_ui: any
  app_web_view: any
  desktop_tray: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.15

  melos: ^7.0.0
  # dependency_validator: ^5.0.2 # Temporarily removed due to analyzer conflict

flutter:
  uses-material-design: true
  generate: true

# generate icon with `dart run flutter_launcher_icons:main``
flutter_launcher_icons:
  image_path: "app_widget/artwork/assets/icon/app-icon.png"
  android: true
  ios: true
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true

melos:
  name: semaphore_client
  command:
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # Generates a link to a prefilled GitHub release creation page.
      releaseUrl: true

  scripts:
    prepare:
      description: Prepare project with `bootstrap`, `build_runner build` and `gen-l10n`
      steps:
        - melos bootstrap
        - melos run gen-l10n
        - melos run build-runner

    build-runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        orderDependents: true
      description: Run `dart/flutter analyze` for all packages.

    analyze:
      run: flutter analyze --fatal-infos
      exec:
        concurrency: 1
        orderDependents: true
      description: Run `flutter analyze` for all packages.

    fix:
      run: dart fix . --apply
      exec:
        orderDependents: true
      description: Run `dart fix` for all packages.

    fix-dry-run:
      run: dart fix . --dry-run
      exec:
        orderDependents: true
      description: Run `dart fix` in dry-run mode for all packages.

    format:
      run: dart format .
      exec:
        orderDependents: true
      description: Run `dart format` for all packages.

    format-check:
      run: dart format . --set-exit-if-changed
      exec:
        orderDependents: true
      description: Run `dart format` checks for all packages.

    upgrade:
      run: dart pub upgrade --major-versions
      exec:
        orderDependents: true
      description: Run `flutter pub upgrade` update dependencies in all packages.

    outdated:
      run: dart pub outdated
      exec:
        orderDependents: true
      description: Run `flutter pub outdated` check outdated dependencies in all packages.

    validate-dependencies:
      run: dart run dependency_validator
      description: Run `dart run dependency_validator` check dependencies usage.

    test:
      run: melos exec --order-dependents --fail-fast flutter test || true
      description: Run Flutter tests for all packages (ignores packages without tests).
      steps:
        - melos run test:dart
        - melos run test:flutter

    test:dart:
      run: dart test
      exec:
        orderDependents: true
        fail-fast: true
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      run: flutter test
      exec:
        orderDependents: true
        fail-fast: true
      packageFilters:
        flutter: true
        dirExists: test

    brick-test:
      run: cd tool/brick_tests && dart pub get && dart test *.dart
      description: Run Mason brick tests separately from Flutter tests.

    gen-l10n:
      run: flutter gen-l10n
      exec:
        orderDependents: true
      packageFilters:
        flutter: true
        fileExists: l10n.yaml
      description: Generate localization files from ARB files.

