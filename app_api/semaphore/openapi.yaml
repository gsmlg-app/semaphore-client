  securitySchemes:
    cookie:
      type: apiKey
      name: Cookie
      in: header
      description: |
        Session cookie for authentication.
        Automatically set by the server after successful login.
        Used for web UI and regular API interactions.

        Example: `semaphore=encoded_session_data`
    bearer:
      type: apiKey
      name: Authorization
      in: header
      description: |
        API token for programmatic access.
        Should be prefixed with "Bearer ".

        Get your API token from the user settings page.

        Example: `Bearer your-api-token-here`
  schemas:
    SecretStorage:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          minimum: 1
        name:
          type: string
          example: Vault Storage
        type:
          type: string
          enum:
            - local
            - vault
          example: vault
        params:
          type: object
          description: Storage parameters (format depends on type)
          example:
            url: https://vault.example.com
            token: ...
        readonly:
          type: boolean
          description: Whether the storage is read-only
          example: false
    SecretStorageRequest:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          example: Vault Storage
        type:
          type: string
          enum:
            - local
            - vault
          example: vault
        params:
          type: object
          description: Storage parameters (format depends on type)
        readonly:
          type: boolean
          description: Whether the storage is read-only
          example: false
    Runner:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          description: Project ID (null for global runners)
          example: 1
        webhook:
          type: string
          description: Webhook URL for the runner
          example: https://runner.example.com/webhook
        max_parallel_tasks:
          type: integer
          description: Maximum number of parallel tasks
          example: 5
        active:
          type: boolean
          description: Whether the runner is active
          example: true
        name:
          type: string
          description: Runner name
          example: production-runner
        tag:
          type: string
          description: Runner tag for identification
          example: production
        touched:
          type: string
          format: date-time
          description: Last heartbeat time
          example: '2023-01-01T12:00:00Z'
        cleaning_requested:
          type: string
          format: date-time
          description: When cleaning was requested
          example: '2023-01-01T11:00:00Z'
    RunnerRequest:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          example: production-runner
        tag:
          type: string
          example: production
        max_parallel_tasks:
          type: integer
          example: 5
          minimum: 1
        webhook:
          type: string
          example: https://runner.example.com/webhook
    RunnerTag:
      type: object
      properties:
        tag:
          type: string
          example: production
        number_of_runners:
          type: integer
          example: 3
    Role:
      type: object
      properties:
        slug:
          type: string
          description: Unique identifier for the role
          example: admin
        name:
          type: string
          description: Display name of the role
          example: Administrator
        permissions:
          type: integer
          description: Permission bitmask
          example: 65535
        project_id:
          type: integer
          description: Project ID (null for global roles)
          example: 1
    RoleRequest:
      type: object
      properties:
        name:
          type: string
          example: Administrator
        permissions:
          type: integer
          example: 65535
    TemplateRolePerm:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        role_slug:
          type: string
          example: admin
        template_id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          minimum: 1
        permissions:
          type: integer
          description: Permission bitmask
          example: 255
    TemplateRolePermRequest:
      type: object
      properties:
        role_slug:
          type: string
          example: admin
        permissions:
          type: integer
          example: 255
    Option:
      type: object
      properties:
        key:
          type: string
          example: max_tasks
        value:
          type: string
          example: '10'
    OptionRequest:
      type: object
      properties:
        key:
          type: string
          example: max_tasks
        value:
          type: string
          example: '10'
    Subscription:
      type: object
      properties:
        id:
          type: string
          example: sub_1234567890
        status:
          type: string
          enum:
            - active
            - canceled
            - incomplete
            - past_due
            - trialing
            - unpaid
          example: active
        plan_id:
          type: string
          example: plan_1234567890
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
    App:
      type: object
      properties:
        id:
          type: string
          example: ansible
        name:
          type: string
          example: Ansible
        description:
          type: string
          example: Ansible automation tool
        priority:
          type: integer
          example: 100
        active:
          type: boolean
          example: true
        config:
          type: object
          description: App-specific configuration
    Pong:
      type: string
      x-example: pong
    Login:
      type: object
      properties:
        auth:
          type: string
          description: Username/Email address
          x-example: user@semaphoreui.com
        password:
          type: string
          format: password
          description: Password
    LoginMetadata:
      type: object
      properties:
        oidc_providers:
          type: array
          description: List of OIDC providers
          items:
            type: object
            properties:
              id:
                type: string
                description: ID of the provider, used in the login URL
                x-example: mysso
              name:
                type: string
                description: Text to show on the login button
                x-example: Sign in with MySSO
    UserRequest:
      type: object
      properties:
        name:
          type: string
          x-example: Integration Test User
          example: Integration Test User
        username:
          type: string
          x-example: test-user
          example: test-user
        email:
          type: string
          x-example: test@ansiblesemaphore.test
          example: test@ansiblesemaphore.test
        password:
          type: string
          format: password
        alert:
          type: boolean
        admin:
          type: boolean
        external:
          type: boolean
    UserPutRequest:
      type: object
      properties:
        name:
          type: string
          x-example: Integration Test User2
          example: Integration Test User2
        username:
          type: string
          x-example: test-user2
          example: test-user2
        email:
          type: string
          x-example: test2@ansiblesemaphore.test
          example: test2@ansiblesemaphore.test
        alert:
          type: boolean
        admin:
          type: boolean
    EmailLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    EmailVerifyRequest:
      type: object
      properties:
        token:
          type: string
          example: '123456'
    PasswordUpdateRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          example: newpassword123
    TotpEnableRequest:
      type: object
      properties:
        name:
          type: string
          example: My Phone
    TotpQrResponse:
      type: object
      properties:
        qr_code:
          type: string
          format: base64
          description: Base64 encoded QR code image
        secret:
          type: string
          description: TOTP secret for manual entry
    User:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        username:
          type: string
        email:
          type: string
        created:
          type: string
          format: date-time
        alert:
          type: boolean
        admin:
          type: boolean
        external:
          type: boolean
        roles:
          type: array
          items:
            type: object
            properties:
              project_id:
                type: integer
              role:
                type: string
                enum:
                  - owner
                  - manager
                  - task_runner
                  - guest
        totp_enabled:
          type: boolean
          description: Whether TOTP 2FA is enabled
          example: false
        totp_secrets:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
                example: My Phone
    ProjectUser:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - owner
            - manager
            - task_runner
            - guest
    ProjectInvite:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          minimum: 1
        user_id:
          type: integer
          minimum: 1
          description: User ID for user-based invites (optional)
        email:
          type: string
          format: email
          description: Email address for email-based invites (optional)
        role:
          type: string
          enum:
            - owner
            - manager
            - task_runner
            - guest
          example: manager
        status:
          type: string
          enum:
            - pending
            - accepted
            - declined
            - expired
          example: pending
        inviter_user_id:
          type: integer
          minimum: 1
          description: ID of the user who created the invite
        created:
          type: string
          format: date-time
          description: When the invite was created
        expires_at:
          type: string
          format: date-time
          description: When the invite expires (optional)
        accepted_at:
          type: string
          format: date-time
          description: When the invite was accepted (optional)
        inviter_user:
          $ref: '#/components/schemas/User'
        user:
          $ref: '#/components/schemas/User'
    ProjectInviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address to invite (use either user_id or email, not both)
          x-example: user@example.com
        role:
          type: string
          enum:
            - owner
            - manager
            - task_runner
            - guest
          example: manager
        expires_at:
          type: string
          format: date-time
          description: When the invite should expire (optional, defaults to 7 days)
      required:
        - role
    AcceptInviteRequest:
      type: object
      properties:
        token:
          type: string
          description: The invitation token
          x-example: a1b2c3d4e5f6...
      required:
        - token
    ProjectBackup:
      type: object
      example:
        meta:
          name: homelab
          alert: true
          alert_chat: Test
          max_parallel_tasks: 0
          type: null
        templates:
          - inventory: Build
            repository: Demo
            environment: Empty
            name: Build
            playbook: build.yml
            arguments: '[]'
            allow_override_args_in_task: false
            description: Build Job
            vault_key: null
