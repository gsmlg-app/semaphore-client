openapi: 3.0.3
info:
  title: Semaphore API
  description: >
    Semaphore API provides endpoints for managing and interacting with the
    Semaphore UI.

    This documentation outlines the available operations and data models.


    ## Authentication


    Semaphore API supports multiple authentication methods:


    * **Session Cookies**: Automatic authentication after web login

    * **API Tokens**: For programmatic access using Bearer tokens

    * **Multiple Auth Providers**: LDAP, OIDC, email OTP, TOTP


    ## Rate Limiting


    API requests may be rate limited to ensure fair usage.


    ## Error Handling


    The API uses standard HTTP status codes and returns detailed error messages
    in JSON format.


    ## Pagination


    List endpoints support pagination using `limit` and `offset` parameters.
  version: 2.16.14
  contact:
    name: Semaphore UI
    url: https://semaphoreui.com
    email: support@semaphoreui.com
  license:
    name: MIT
    url: https://github.com/semaphoreui/semaphore/blob/master/LICENSE
servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://{hostname}/api
    description: Production server
    variables:
      hostname:
        default: your-semaphore-instance.com
        description: Your Semaphore instance hostname
  - url: /api
    description: Relative path (uses current host)
tags:
  - name: authentication
    description: Authentication, Logout & API Tokens
  - name: project
    description: Everything related to a project
  - name: user
    description: User-related API
  - name: integration
    description: Integration API
  - name: admin
    description: Administrative operations and system management
  - name: terraform
    description: Terraform state management and operations
  - name: runner
    description: Runner management and operations
  - name: schedule
    description: Task scheduling and management
  - name: template
    description: Task templates and execution
  - name: inventory
    description: Ansible inventory management
  - name: repository
    description: Git repository management
  - name: environment
    description: Environment variables and secrets management
externalDocs:
  description: Semaphore UI Documentation
  url: https://docs.semaphoreui.com
security:
  - bearer: []
  - cookie: []
paths:
  /debug/gc:
    post:
      summary: Garbage collector
      description: Run the garbage collector
      responses:
        '204':
          description: Successful "OK" reply
  /ping:
    get:
      summary: PING test
      security: []
      responses:
        '200':
          description: Successful "PONG" reply
          headers:
            content-type:
              x-example: text/plain; charset=utf-8
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Pong'
  # /ws:
  #   get:
  #     summary: Websocket handler
  #     responses:
  #       '200':
  #         description: OK
  #       '401':
  #         description: not authenticated
  #     servers:
  #       - url: ws:/api
  #       - url: wss:/api
  /info:
    get:
      summary: Fetches information about semaphore
      description: you must be authenticated to use this
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoType'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/InfoType'
  /auth/login:
    get:
      tags:
        - authentication
      summary: Fetches login metadata
      description: Fetches metadata for login, such as available OIDC providers
      security: []
      responses:
        '200':
          description: Login metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginMetadata'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/LoginMetadata'
    post:
      tags:
        - authentication
      summary: Performs Login
      description: Upon success you will be logged in
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '204':
          description: You are logged in
        '400':
          description: something in body is missing / is invalid
  /auth/logout:
    post:
      tags:
        - authentication
      summary: Destroys current session
      responses:
        '204':
          description: Your session was successfully nuked
  /auth/oidc/{provider_id}/login:
    parameters:
      - name: provider_id
        in: path
        required: true
        example: mysso
        schema:
          type: string
    get:
      tags:
        - authentication
      summary: Begin OIDC authentication flow and redirect to OIDC provider
      description: >-
        The user agent is redirected to this endpoint when chosing to sign in
        via OIDC
      responses:
        '302':
          description: >-
            Redirection to the OIDC provider on success, or to the login page on
            error
  /auth/oidc/{provider_id}/redirect:
    parameters:
      - name: provider_id
        in: path
        required: true
        example: mysso
        schema:
          type: string
    get:
      tags:
        - authentication
      summary: Finish OIDC authentication flow, upon succes you will be logged in
      description: >-
        The user agent is redirected here by the OIDC provider to complete
        authentication
      responses:
        '302':
          description: >-
            Redirection to the Semaphore root URL on success, or to the login
            page on error
  /auth/oidc/{provider_id}/redirect/{redirect_path}:
    parameters:
      - name: provider_id
        in: path
        required: true
        example: mysso
        schema:
          type: string
      - name: redirect_path
        in: path
        required: true
        description: Path to redirect to after authentication
        schema:
          type: string
    get:
      tags:
        - authentication
      summary: Finish OIDC authentication flow with custom redirect path
      description: >-
        The user agent is redirected here by the OIDC provider to complete
        authentication with custom redirect
      responses:
        '302':
          description: >-
            Redirection to the specified path on success, or to the login page
            on error
  /auth/verify/email:
    post:
      tags:
        - authentication
      summary: Start email verification process
      description: Sends verification email to start email-based authentication
      security: []
      requestBody:
        $ref: '#/components/requestBodies/EmailLoginRequest'
      responses:
        '200':
          description: Verification email sent
        '400':
          description: Invalid email address
        '429':
          description: Too many requests
  /auth/login/email:
    get:
      tags:
        - authentication
      summary: Check email login status
      description: Check if email verification is pending
      security: []
      parameters:
        - name: email
          in: query
          required: true
          description: Email address to check
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Email login status
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: boolean
                    example: true
                  expires_at:
                    type: string
                    format: date-time
            text/plain; charset=utf-8:
              schema:
                type: object
                properties:
                  pending:
                    type: boolean
                    example: true
                  expires_at:
                    type: string
                    format: date-time
    post:
      tags:
        - authentication
      summary: Login with email and OTP
      description: Complete email-based authentication with OTP token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
        required: true
      responses:
        '204':
          description: Login successful
        '400':
          description: Invalid or expired token
  /auth/login/email/resend:
    post:
      tags:
        - authentication
      summary: Resend email verification
      description: Resend verification email for email-based authentication
      security: []
      requestBody:
        $ref: '#/components/requestBodies/EmailLoginRequest'
      responses:
        '200':
          description: Verification email resent
        '400':
          description: Invalid email address
  /auth/verify:
    post:
      tags:
        - authentication
      summary: Verify current session
      description: Verify if current session is valid
      responses:
        '200':
          description: Session is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
            text/plain; charset=utf-8:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Session is invalid or expired
  /auth/recovery:
    post:
      tags:
        - authentication
      summary: Recover session
      description: Attempt to recover a lost session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: recovery_token_here
        required: true
      responses:
        '200':
          description: Session recovered
        '400':
          description: Invalid recovery token
  /user/:
    get:
      tags:
        - user
      summary: Fetch logged in user
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/User'
  /user/tokens:
    get:
      tags:
        - authentication
        - user
      summary: Fetch API tokens for user
      responses:
        '200':
          description: API Tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIToken'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIToken'
    post:
      tags:
        - authentication
        - user
      summary: Create an API token
      responses:
        '201':
          description: API Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/APIToken'
  /user/tokens/{api_token_id}:
    parameters:
      - name: api_token_id
        in: path
        required: true
        example: kwofd61g93-yuqvex8efmhjkgnbxlo8mp1tin6spyhu=
        schema:
          type: string
    delete:
      tags:
        - authentication
        - user
      summary: Expires API token
      responses:
        '204':
          description: Expired API Token
  /users:
    get:
      tags:
        - user
      summary: Fetches all users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - user
      summary: Creates a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: User creation failed
  /users/{user_id}/:
    parameters:
      - $ref: '#/components/parameters/user_id'
    get:
      tags:
        - user
      summary: Fetches a user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags:
        - user
      summary: Updates user details
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPutRequest'
        required: true
      responses:
        '204':
          description: User Updated
    delete:
      tags:
        - user
      summary: Deletes user
      responses:
        '204':
          description: User deleted
  /users/{user_id}/password:
    parameters:
      - $ref: '#/components/parameters/user_id'
    post:
      tags:
        - user
      summary: Updates user password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
        required: true
      responses:
        '204':
          description: Password updated
        '400':
          description: Invalid password
  /users/{user_id}/2fas/totp:
    parameters:
      - $ref: '#/components/parameters/user_id'
    post:
      tags:
        - user
      summary: Enable TOTP 2FA
      description: Enable Time-based One-Time Password two-factor authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
        required: true
      responses:
        '201':
          description: TOTP enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpQrResponse'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/TotpQrResponse'
  /users/{user_id}/2fas/totp/{totp_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        example: 1
        schema:
          type: integer
      - name: totp_id
        in: path
        required: true
        example: 1
        schema:
          type: integer
    get:
      tags:
        - user
      summary: Get TOTP QR code
      description: Get QR code for TOTP setup
      responses:
        '200':
          description: TOTP QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpQrResponse'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/TotpQrResponse'
    delete:
      tags:
        - user
      summary: Disable TOTP 2FA
      description: Disable Time-based One-Time Password two-factor authentication
      responses:
        '204':
          description: TOTP disabled
  /invites/accept:
    post:
      tags:
        - project
        - authentication
      summary: Accept project invitation
      description: Accept a project invitation using the provided token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
        required: true
      responses:
        '204':
          description: Invitation accepted successfully
        '400':
          description: Invalid token, invitation expired, or user already a member
        '403':
          description: Invitation not for this user
        '404':
          description: Invitation not found
  /projects:
    get:
      tags:
        - project
      summary: Get projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags:
        - project
      summary: Create a new project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/restore:
    post:
      tags:
        - project
      summary: Restore Project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBackup'
        required: true
      responses:
        '200':
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Project'
  /events:
    get:
      summary: Get Events related to Semaphore and projects you are part of
      responses:
        '200':
          description: Array of events in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /events/last:
    get:
      summary: Get last 200 Events related to Semaphore and projects you are part of
      responses:
        '200':
          description: Array of events in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /project/{project_id}/:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      tags:
        - project
      summary: Fetch project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Project'
    put:
      tags:
        - project
      summary: Update project
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectRequest'
                - properties:
                    id:
                      type: integer
                      minimum: 1
        required: true
      responses:
        '204':
          description: Project saved
    delete:
      tags:
        - project
      summary: Delete project
      responses:
        '204':
          description: Project deleted
  /project/{project_id}/backup:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      tags:
        - project
      summary: Backup A Project
      responses:
        '200':
          description: Backup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBackup'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProjectBackup'
  /project/{project_id}/role:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      tags:
        - project
      summary: Fetch permissions of the current user for project
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    example: owner
                  permissions:
                    type: number
                    example: 0
            text/plain; charset=utf-8:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    example: owner
                  permissions:
                    type: number
                    example: 0
  /project/{project_id}/events:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      tags:
        - project
      summary: Get Events related to this project
      responses:
        '200':
          description: Array of events in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /project/{project_id}/users:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      tags:
        - project
      summary: Get users linked to project
      parameters:
        - name: sort
          in: query
          required: true
          description: sorting name
          example: email
          schema:
            type: string
            enum:
              - name
              - username
              - email
              - role
        - name: order
          in: query
          required: true
          description: ordering manner
          example: desc
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUser'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUser'
    post:
      tags:
        - project
      summary: Link user to project
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  minimum: 2
                role:
                  type: string
                  enum:
                    - owner
                    - manager
                    - task_runner
                    - guest
                  example: owner
        required: true
      responses:
        '204':
          description: User added
  /project/{project_id}/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/user_id'
    delete:
      tags:
        - project
      summary: Removes user from project
      responses:
        '204':
          description: User removed
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - owner
                    - manager
                    - task_runner
                    - guest
                  example: owner
        required: true
      summary: Update user role
      tags:
        - project
      responses:
        '204':
          description: User updated
  /project/{project_id}/invites:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      tags:
        - project
      summary: Get invitations for project
      parameters:
        - name: sort
          in: query
          required: false
          description: sorting field
          example: created
          schema:
            type: string
            enum:
              - created
              - status
              - role
        - name: order
          in: query
          required: false
          description: ordering manner
          example: desc
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Project invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInvite'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInvite'
    post:
      tags:
        - project
      summary: Create project invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInviteRequest'
        required: true
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInvite'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProjectInvite'
        '400':
          description: Bad request (invalid role, missing user_id/email, or both provided)
        '409':
          description: User already a member or invitation already exists
  /project/{project_id}/invites/{invite_id}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/invite_id'
    get:
      tags:
        - project
      summary: Get specific project invitation
      responses:
        '200':
          description: Project invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInvite'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProjectInvite'
        '404':
          description: Invitation not found
  /project/{project_id}/integrations:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      tags:
        - integration
      summary: get all integrations
      responses:
        '200':
          description: integration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integration'
            text/plain; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integration'
    post:
      summary: create a new integration
      tags:
        - integration
      requestBody:
        $ref: '#/components/requestBodies/IntegrationRequest'
      responses:
        '201':
          description: Integration Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Integration'
  /project/{project_id}/integrations/{integration_id}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/integration_id'
    get:
      tags:
        - integration
      summary: Get Integration
      responses:
        '200':
          description: Integration Value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Integration'
    put:
      tags:
        - integration
