  /terraform/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        example: production
        schema:
          type: string
    get:
      summary: Get Terraform state by alias
      description: Public endpoint to get Terraform state using alias
      security: []
      responses:
        '200':
          description: Terraform state
          content:
            type: application/json
        '404':
          description: Terraform state not found
    post:
      summary: Add Terraform state
      description: Public endpoint to add/update Terraform state using alias
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  description: Terraform state data (base64 encoded)
                workspace:
                  type: string
                  example: default
        required: true
      responses:
        '200':
          description: Terraform state added/updated
          content:
            type: application/json
        '400':
          description: Invalid state data
    lock:
      summary: Lock Terraform state
      description: Public endpoint to lock Terraform state using alias
      security: []
      responses:
        '200':
          description: Terraform state locked
          content:
            type: application/json
        '409':
          description: State already locked
    unlock:
      summary: Unlock Terraform state
      description: Public endpoint to unlock Terraform state using alias
      security: []
      responses:
        '200':
          description: Terraform state unlocked
          content:
            type: application/json
        '404':
          description: State not locked
  /integrations/{integration_alias}:
    parameters:
      - name: integration_alias
        in: path
        required: true
        example: deploy
        schema:
          type: string
    get:
      summary: Get integration by alias
      description: Public endpoint to trigger integration using alias
      security: []
      responses:
        '200':
          description: Integration triggered
          content:
            type: application/json
        '404':
          description: Integration not found
    post:
      summary: Trigger integration
      description: Public endpoint to trigger integration using alias
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Integration-specific data
        required: true
      responses:
        '200':
          description: Integration triggered
        '400':
          description: Invalid integration data
    options:
      summary: Integration CORS options
      description: CORS preflight for integration alias
      security: []
      responses:
        '204':
          description: CORS preflight successful
